<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | The Exultant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Source+Sans+3:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="../assets/css/style.css?v=6" rel="stylesheet">
</head>
<body class="admin-login-page">
    <div class="admin-login-card animate-fadeInUp">
        <div class="login-header">
            <h1>THE EXULTANT</h1>
            <p>Admin Login</p>
            <div class="hero-divider"></div>
        </div>

        <div id="loginAlert"></div>

        <form method="POST" action="" id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-maroon w-100 mt-2">
                <i class="fas fa-sign-in-alt me-2"></i> Login
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="../index.html" class="text-decoration-none" style="color: var(--maroon); font-size: 0.85rem;">
                <i class="fas fa-arrow-left me-1"></i> Back to Website
            </a>
        </div>
    </div>

<script src="../assets/js/core.js"></script>
<script src="../assets/js/admin-pages.js"></script>
<script>
    ExultantAdmin.renderLogin();
</script>
</body>
</html>
